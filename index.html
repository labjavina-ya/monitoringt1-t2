<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Monitoring TRANS 1 & 2</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
            background-color: #0f0f1a; /* Warna default sebelum GAS berhasil dimuat */
        }
        iframe {
            position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            width: 100%; height: 100%; border: none; margin: 0; padding: 0;
            background-color: #0f0f1a;
        }
    </style>
</head>
<body>

    <!-- Kode iframe Full Screen -->
    <iframe src="https://script.google.com/macros/s/AKfycbznAJNV9UvoidGiC82TER8-5eQXfci1019FSNAmfpXElICjjpOwqPgx-wyWALELmzNlKw/exec" id="gasFrame">Browser Anda tidak mendukung iframe.</iframe>

    <script>
        // Script untuk menerima warna dari GAS secara dinamis
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SET_BG_COLOR') {
                // Terapkan warna ke background halaman Vercel
                document.documentElement.style.backgroundColor = event.data.color;
                document.body.style.backgroundColor = event.data.color;
                document.getElementById('gasFrame').style.backgroundColor = event.data.color;
                
                // Ubah juga warna Theme-Color agar status bar iPhone menyesuaikan
                const themeMeta = document.querySelector('meta[name="theme-color"]');
                if (themeMeta) {
                    themeMeta.setAttribute('content', event.data.color);
                }
            }
        });
    </script>
</body>
</html>
