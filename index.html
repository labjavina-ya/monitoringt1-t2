<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Monitoring TRANS 1 & 2</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monitoring">
    <meta name="theme-color" content="#020202">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #020202;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            overscroll-behavior: none;
        }

        #gasFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background-color: #020202;
            display: block;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://script.google.com/macros/s/AKfycbznAJNV9UvoidGiC82TER8-5eQXfci1019FSNAmfpXElICjjpOwqPgx-wyWALELmzNlKw/exec" 
        id="gasFrame" 
        allow="camera; microphone; fullscreen"
        frameborder="0">
        Browser Anda tidak mendukung iframe.
    </iframe>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SET_BG_COLOR') {
                document.documentElement.style.backgroundColor = event.data.color;
                document.body.style.backgroundColor = event.data.color;
                
                const frame = document.getElementById('gasFrame');
                if (frame) {
                    frame.style.backgroundColor = event.data.color;
                }
                
                const themeMeta = document.querySelector('meta[name="theme-color"]');
                if (themeMeta) {
                    themeMeta.setAttribute('content', event.data.color);
                }
            }
        });
    </script>
</body>
</html>
