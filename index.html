<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring List Reject</title>
    <style>
        /* 1. Menghilangkan margin bawaan browser dan scrollbar ganda */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Mencegah halaman utama ikut bergeser */
            background-color: #f5f5f5;
        }

        /* 2. Memaksa iframe menempel penuh di semua sisi layar */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
