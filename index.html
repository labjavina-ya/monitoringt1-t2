<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/testpwa/manifest.json">
    <link rel="apple-touch-icon" href="/testpwa/icon-192.png">
    <link rel="icon" type="image/png" href="/testpwa/icon-192.png">
    <title>MONITORING TRANS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --bg-base: #0f172a;
        }
        html, body {
            width: 100%;
            height: var(--app-height, 100dvh);
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            color: white;
        }
        #app-iframe {
            position: fixed; top: 0; left: 0;
            width: 100%; height: var(--app-height, 100dvh);
            border: none; display: block; background: transparent; z-index: 1;
        }
        #loading-screen {
            position: fixed; inset: 0; background-color: var(--bg-base);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; transition: opacity 0.5s ease;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(59,130,246,0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 16px; font-size: 14px; color: #94a3b8; font-weight: 500; }
        #fallback { position: fixed; inset: 0; background: var(--bg-base); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 20; }
        #fallback.visible { display: flex; }
        .fallback-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .fallback-desc { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
        .fallback-btn { padding: 12px 24px; background: #3b82f6; color: white; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <p class="loading-text">Memuat Aplikasi Monitoring...</p>
    </div>

    <iframe id="app-iframe" src="about:blank" onload="onIframeLoad()"
        allow="fullscreen; autoplay; camera; microphone; geolocation" allowfullscreen></iframe>

    <div id="fallback">
        <h2 class="fallback-title">⚠️ Aplikasi Tidak Dapat Dimuat</h2>
        <p class="fallback-desc">Browser mungkin memblokir konten dari domain lain.<br>Klik tombol di bawah untuk membuka langsung.</p>
        <a href="https://script.google.com/macros/s/AKfycbznAJNV9UvoidGiC82TER8-5eQXfci1019FSNAmfpXElICjjpOwqPgx-wyWALELmzNlKw/exec" class="fallback-btn">Buka Aplikasi Langsung</a>
    </div>

    <script>
        var GAS_URL = 'https://script.google.com/macros/s/AKfycbznAJNV9UvoidGiC82TER8-5eQXfci1019FSNAmfpXElICjjpOwqPgx-wyWALELmzNlKw/exec';

        // Tinggi layar fisik (bypass bug 100vh)
        function setTrueAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.screen.height + 'px');
        }
        setTrueAppHeight();
        window.addEventListener('resize', setTrueAppHeight);
        window.addEventListener('orientationchange', function(){ setTimeout(setTrueAppHeight, 300); });

        // Baca safe area dari wrapper (top-level, pasti bisa)
        function getInsets() {
            var s = getComputedStyle(document.documentElement);
            return {
                type: 'safe-area',
                top:    parseInt(s.getPropertyValue('--safe-top'))    || 0,
                bottom: parseInt(s.getPropertyValue('--safe-bottom')) || 0,
                left:   parseInt(s.getPropertyValue('--safe-left'))   || 0,
                right:  parseInt(s.getPropertyValue('--safe-right'))  || 0,
                viewportHeight: window.innerHeight,
                screenHeight: window.screen.height
            };
        }

        // JALUR 1: URL parameter (paling pasti, tidak tergantung timing)
        (function initIframe() {
            var i = getInsets();
            document.getElementById('app-iframe').src =
                GAS_URL + '?st=' + i.top + '&sb=' + i.bottom + '&sl=' + i.left + '&sr=' + i.right;
        })();

        // JALUR 2: postMessage
        function sendSafeArea() {
            var f = document.getElementById('app-iframe');
            if (f && f.contentWindow) {
                try { f.contentWindow.postMessage(getInsets(), '*'); } catch (e) {}
            }
        }

        // JALUR 3: respons jika iframe meminta
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'request-safe-area') sendSafeArea();
        });

        function onIframeLoad() {
            var loading = document.getElementById('loading-screen');
            if (loading) loading.classList.add('hidden');
            sendSafeArea();
            setTimeout(sendSafeArea, 500);
            setTimeout(sendSafeArea, 1500);
        }

        // Kirim berkala 8 detik pertama (jaga-jaga)
        var n = 0;
        var ticker = setInterval(function () { sendSafeArea(); if (++n > 8) clearInterval(ticker); }, 1000);

        window.addEventListener('resize', sendSafeArea);
        window.addEventListener('orientationchange', function () {
            setTimeout(sendSafeArea, 300); setTimeout(sendSafeArea, 600);
        });
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) setTimeout(sendSafeArea, 100);
        });

        setTimeout(function () {
            var loading = document.getElementById('loading-screen');
            var fallback = document.getElementById('fallback');
            if (loading && !loading.classList.contains('hidden')) {
                loading.classList.add('hidden');
                fallback.classList.add('visible');
            }
        }, 10000);
    </script>
</body>
</html>
