<head>
    <meta charset="UTF-8">
    
    <!-- 1. WAJIB: Meta tag untuk iOS agar bisa fullscreen (Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aplikasi Saya">

    <!-- 2. Viewport dengan user-scalable=no agar tidak bisa di-zoom (opsional tapi disarankan untuk PWA) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Aplikasi Google Script Saya</title>
    
    <!-- Pastikan path manifest.json benar. Jika di root repo GitHub, gunakan ./manifest.json -->
    <link rel="manifest" href="./manifest.json" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            position: fixed; 
            /* Tambahan untuk iOS 11+ dengan notch */
            env(safe-area-inset-top, 0px);
            env(safe-area-inset-bottom, 0px);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
