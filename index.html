<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Monitoring TRANS 1 & 2</title>
    
    <!-- Tag PWA wajib untuk iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monitoring">
    <meta name="theme-color" content="#020202">
    <meta name="supported-color-schemes" content="dark">
    
    <style>
        /* RESET CSS EKSTREM UNTUK IOS */
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100% !important;
            height: 100% !important;
            height: 100dvh !important; /* Tinggi dinamis iOS */
            background-color: #020202 !important;
            overflow: hidden !important;
            /* Paksa seluruh halaman mengunci di 4 sudut layar */
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            inset: 0 !important; /* Trik memaksa masuk ke semua sudut */
            overscroll-behavior: none !important;
        }

        #gasFrame {
            /* Paksa iframe juga mengunci di 4 sudut layar */
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: #020202 !important;
            display: block !important;
        }
    </style>
</head>
<body>

    <!-- Iframe Full Screen -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbznAJNV9UvoidGiC82TER8-5eQXfci1019FSNAmfpXElICjjpOwqPgx-wyWALELmzNlKw/exec" 
        id="gasFrame" 
        allow="camera; microphone; fullscreen"
        frameborder="0">
        Browser Anda tidak mendukung iframe.
    </iframe>

    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SET_BG_COLOR') {
                document.documentElement.style.backgroundColor = event.data.color;
                document.body.style.backgroundColor = event.data.color;
                
                const frame = document.getElementById('gasFrame');
                if (frame) {
                    frame.style.backgroundColor = event.data.color;
                }
                
                const themeMeta = document.querySelector('meta[name="theme-color"]');
                if (themeMeta) {
                    themeMeta.setAttribute('content', event.data.color);
                }
            }
        });
    </script>
</body>
</html>
