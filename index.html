<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Monitoring TRANS 1 & 2</title>

    <!-- TAG Khusus untuk iOS Safari (iPhone) agar Notch/Dynamic Island mengikuti warna -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        /* 1. Menghilangkan margin bawaan browser */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            /* UBAH WARNA INI MENJADI GELAP SESUAI TEMA APLIKASI GAS ANDA */
            background-color: #0f0f1a; 
        }

        /* 2. Memaksa iframe menempel penuh di semua sisi layar */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            background-color: #0f0f1a; /* Tambahkan ini juga sebagai fallback */
        }
    </style>
</head>
<body>

    <!-- Kode iframe Full Screen -->
    <iframe src="https://script.google.com/macros/s/AKfycbznAJNV9UvoidGiC82TER8-5eQXfci1019FSNAmfpXElICjjpOwqPgx-wyWALELmzNlKw/exec">
        Browser Anda tidak mendukung iframe.
    </iframe>

</body>
</html>
