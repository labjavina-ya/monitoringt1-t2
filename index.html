<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Monitoring TRANS 1 & 2</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020202">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dinamis untuk mobile, menghindari address bar bug */
            overflow: hidden;
            background-color: #020202; /* Warna dasar sama dengan aplikasi */
            position: fixed; /* Mencegah body bergeser saat keyboard muncul */
            top: 0; left: 0; right: 0; bottom: 0;
            overscroll-behavior: none; /* Matikan pull-to-refresh */
        }
        
        iframe {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
            margin: 0; 
            padding: 0;
            display: block;
            background-color: #020202;
        }
    </style>
</head>
<body>

    <!-- Iframe Full Screen dengan izin Kamera & Fullscreen -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbznAJNV9UvoidGiC82TER8-5eQXfci1019FSNAmfpXElICjjpOwqPgx-wyWALELmzNlKw/exec" 
        id="gasFrame" 
        allow="camera; microphone; fullscreen"
        frameborder="0">
        Browser Anda tidak mendukung iframe.
    </iframe>

    <script>
        // Script untuk menerima warna dari GAS secara dinamis
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SET_BG_COLOR') {
                // Terapkan warna ke background halaman GitHub Pages
                document.documentElement.style.backgroundColor = event.data.color;
                document.body.style.backgroundColor = event.data.color;
                
                const frame = document.getElementById('gasFrame');
                if (frame) {
                    frame.style.backgroundColor = event.data.color;
                }
                
                // Ubah juga warna Theme-Color agar status bar HP menyesuaikan
                const themeMeta = document.querySelector('meta[name="theme-color"]');
                if (themeMeta) {
                    themeMeta.setAttribute('content', event.data.color);
                }
            }
        });
    </script>
</body>
</html>
